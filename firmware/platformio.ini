; PocketHID firmware — ESP32-S3
; HID over USB-OTG port, serial logs/flashing over UART port

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Target board has 4 MB flash (devkitc-1 also exists in an 8 MB variant):
; without this setting the binary assumes 8 MB and asserts on boot.
; Note: the right key is board_upload.flash_size (board_build.flash_size is ignored).
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; Custom 4 MB partition table: two 1.75 MB OTA app slots + 384 KB LittleFS
; for the PWA. Standard min_spiffs.csv reserves only 128 KB for the filesystem.
; NVS stays at 0x9000 (default) so saved credentials survive partition updates.
board_build.partitions = partitions_4mb.csv
; LittleFS filesystem serving the built-in PWA: `pio run -t uploadfs`
board_build.filesystem = littlefs
; Automatic patch setting CFG_TUD_HID = 3 to enable all 3 HID interfaces
extra_scripts = pre:scripts/patch_tinyusb.py

build_flags =
    ; USB in "USB-OTG (TinyUSB)" mode (ARDUINO_USB_MODE=0) — mode 1
    ; (hardware CDC/JTAG) does NOT work with Adafruit TinyUSB.
    ; CDC_ON_BOOT=0 keeps serial logs on the UART port.
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    bblanchon/ArduinoJson
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    adafruit/Adafruit TinyUSB Library
    ; BLE GATT: NimBLE-Arduino 2.x requires Arduino core 3.x.
    ; On older espressif32 platforms (core 2.x), downgrade to ~1.4.3
    ; and adapt ble_server.cpp API calls.
    h2zero/NimBLE-Arduino@^2.2.0

; Host unit tests (keymap, 6KRO KbState, macro validation, token):
; `pio test -e native`
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra -Isrc
test_build_src = yes
build_src_filter = -<*> +<keymap.cpp> +<kb_state.cpp>
