; MK-Remote firmware — ESP32-S3
; HID via porta USB-OTG, log/flash via porta UART

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; La board in uso ha 4 MB di flash (la devkitc-1 esiste anche in versione 8 MB):
; senza questa impostazione il binary assume 8 MB e va in assert all'avvio.
; NB: la chiave giusta è board_upload.flash_size (board_build.flash_size viene ignorata)
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; Tabella custom per 4 MB: due slot app (OTA) da 1,75 MB + LittleFS 384 KB
; per la PWA. min_spiffs.csv standard riserva solo 128 KB al filesystem e la
; PWA (~280 KB) non ci sta. NVS resta a 0x9000 (default): credenziali salvate.
board_build.partitions = partitions_4mb.csv
; filesystem LittleFS per servire la PWA (fase 8): `pio run -t uploadfs`
board_build.filesystem = littlefs

build_flags =
    ; USB in modalità "USB-OTG (TinyUSB)" (ARDUINO_USB_MODE=0) — la modalità 1
    ; (hardware CDC/JTAG) NON funziona con la libreria Adafruit TinyUSB.
    ; CDC_ON_BOOT=0: i log restano sulla porta UART.
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    bblanchon/ArduinoJson
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    adafruit/Adafruit TinyUSB Library
    ; BLE GATT (fase 6): NimBLE-Arduino 2.x richiede Arduino core 3.x.
    ; Se il platform espressif32 e' vecchio (core 2.x), degradare a ~1.4.3
    ; e adattare le API di ble_server.cpp (nome caratteristiche cambiate).
    h2zero/NimBLE-Arduino@^2.2.0
