name: Release & Web Flasher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build firmware, LittleFS & Web Flasher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Run checks & build PWA
        run: |
          (cd app && npm ci && npm run lint)
          ./tools/deploy-pwa.sh --prep-only
      - name: Test and build firmware + LittleFS
        working-directory: firmware
        run: |
          pio test -e native
          pio run -e esp32s3
          pio run -e esp32s3 -t buildfs
      - name: Assemble Web Flasher & HTTPS PWA bundle
        run: |
          ./tools/make-flash-release.sh
          rm -rf tools/flash/app
          cp -r app/dist tools/flash/app
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/flash
      - name: Upload firmware binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-release
          path: |
            tools/flash/firmware.bin
            tools/flash/littlefs.bin
            tools/flash/bootloader.bin
            tools/flash/partitions.bin
            tools/flash/boot_app0.bin
            tools/flash/manifest.json

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build web assets & sync Capacitor
        working-directory: app
        run: |
          npm ci
          npm run cap:sync
      - name: Build APK (signed release or debug fallback)
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export ANDROID_VERSION_NAME="$TAG"
          fi
          mkdir -p out
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            export ANDROID_KEYSTORE_PATH=/tmp/release.keystore
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk out/PocketHID.apk
            rm -f /tmp/release.keystore
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set — building sideloadable debug APK"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk out/PocketHID-debug.apk
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/android/out/*.apk

  deploy-pages:
    name: Deploy Web Flasher & PWA to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware binaries
        uses: actions/download-artifact@v4
        with:
          name: firmware-release
          path: release-assets
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
